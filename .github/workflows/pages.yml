# Демо на GitHub Pages: https://kr0nsch.github.io/codesys-to-masterscada/ — статика web/, Pyodide из npm-архива
# (SHA-512), пакет cds2ms zip-архивом, примеры с предрасчётом CLI. Ни одного чужого домена на странице.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Сборка сайта
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/build_site.py --out site
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
