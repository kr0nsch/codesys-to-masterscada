# Объяснённые расхождения original/ (профиль codesys, задача 10 мс) и fixed/ (профиль masterplc, задача 100 мс).
# Режим R1 «строка = вызов» расхождений не даёт; R2 «фиксированный цикл» проявляет период задачи (MS-EXEC-01).

[[divergence]]
case = "FB_FlowTotal"
regime = "R2"
signal = "*"
rule = "MS-EXEC-01"
explanation = "суммирование по строкам: в цикле 100 мс строки с шагом 10 мс схлопываются, интегратор получает меньше вызовов"
