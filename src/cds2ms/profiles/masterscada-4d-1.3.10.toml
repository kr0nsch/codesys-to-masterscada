[names]
# ключевые слова Master ST, которых нет в CODESYS (HW:klyuchevye_slova)
keywords = ["NULL", "R_EDGE", "F_EDGE", "READ_ONLY", "READ_WRITE", "WITH", "TASK", "RESOURCE", "STEP", "INITIAL_STEP", "TRANSITION", "EN", "ENO"]
# слова Lua 5.4, которых нет в ST (https://www.lua.org/manual/5.4/manual.html#3.1)
lua = ["local", "nil", "end", "goto", "until", "then", "elseif", "repeat", "function", "in", "break"]
identifier_rules = "https://help.iek-digital.ru/Help-web/identifikatory.html"

[libraries]
# по оглавлению справки (HW:hmcontent): «Стандартная», подмножество OSCAT, BaseObjects
standard_fbs = ["TON", "TOF", "TP", "R_TRIG", "F_TRIG", "RS", "SR", "CTU", "CTD", "CTUD", "CTU_DINT", "CTD_DINT", "CTUD_DINT"]
