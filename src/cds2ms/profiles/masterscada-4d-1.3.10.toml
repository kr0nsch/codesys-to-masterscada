# Профиль цели: MasterSCADA 4D 1.3.10 / MasterPLC (транслятор задачи Lua 5.4).
# Статус каждой возможности — supported | unsupported | unknown, уверенность H/M/L и источник.
# Отсутствие слова в списке ключевых слов справки не доказательство (там нет даже VAR_INPUT): такие
# статусы — unknown. При unknown симулятор гоняет все варианты из [variants], расхождение — verify.
# HW: = https://help.iek-digital.ru/Help-web/

[profile]
id = "masterscada-4d-1.3.10"
title = "MasterSCADA 4D 1.3.10 / MasterPLC"
version = "1.3.10"
date = "2026-10-20"
help = "https://help.iek-digital.ru/Help-web/"
local_install = "MasterSCADA 4D 1.3.10 Demo (1.3.10.35699) — сборка скрипта против MasterSCADA.Scripts.Model.dll проверена локально; импорт и «Проверить» — у владельца (docs/HARDWARE_VALIDATION.md)"

[semantics]
task_period_default_ms = 100
task_priority_default = 100
dt_default = "DT#0001-01-01-00:00:00"
string_model = "utf8-unbounded"
sfc_qualifiers = ["N", "P1"]
sfc_n = "skip_first_plus_after"
array_oob = "null"
max_array_dims = 3
int_overflow = "unknown"
real_arith = "unknown"
real_as_lreal = false
real_to_int_half = "unknown"
div_zero = "unknown"
time_bits = "unknown"
time_signed = true
for_bounds = "unknown"

# Варианты для unknown: первый — базовый прогон симулятора, остальные — альтернативы (один фактор за раз).
[variants]
int_overflow = ["wrap", "int64", "float64"]
real_arith = ["float64", "float32"]
real_to_int_half = ["away", "even"]
div_zero = ["zero", "error"]
time_bits = ["64", "32"]
for_bounds = ["once", "each"]

