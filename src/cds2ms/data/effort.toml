# Модель трудоёмкости семейства (00-INDEX §4.3): треугольное распределение минут (min, mode, max) на одну
# находку правила. Числа — оценка инженера по шагам MANUAL_STEPS (не замер), подпись в отчёте — «модель,
# не калибрована». Обоснование — в поле why.

[defaults]
auto = [0, 1, 3]
review = [3, 8, 20]
verify = [5, 15, 40]
manual = [20, 45, 120]
impossible = [60, 120, 480]
info = [0, 0, 0]

